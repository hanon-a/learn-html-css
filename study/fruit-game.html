<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사과 바구니 게임</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      color: #333;
    }

    #score {
      font-size: 24px;
      margin: 10px 0;
    }

    .items {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .item {
      width: 80px;
      height: 80px;
      border: 2px solid #ccc;
      border-radius: 10px;
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    .basket {
      margin: 40px auto;
      width: 200px;
      height: 150px;
      border: 4px dashed #888;
      border-radius: 20px;
      background: #fffbe6;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: #555;
    }

    .basket.dragover {
      border-color: green;
      background: #eaffea;
    }
  </style>
</head>
<body>
  <h1>🍎 사과 바구니 게임 🍎</h1>
  <p id="score">점수: 0</p>

  <div class="items">
    <div class="item" draggable="true" data-type="apple">🍎</div>
    <div class="item" draggable="true" data-type="apple">🍏</div>
    <div class="item" draggable="true" data-type="rock">🪨</div>
  </div>

  <div class="basket" id="basket">바구니</div>

  <script>
    const basket = document.getElementById("basket");
    const scoreDisplay = document.getElementById("score");
    let score = 0;

    // 드래그 시작
    document.querySelectorAll(".item").forEach(item => {
      item.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("type", item.dataset.type);
      });
    });

    // 바구니 위로 드래그할 때
    basket.addEventListener("dragover", (e) => {
      e.preventDefault();
      basket.classList.add("dragover");
    });

    // 드래그 떠날 때
    basket.addEventListener("dragleave", () => {
      basket.classList.remove("dragover");
    });

    // 드롭 했을 때
    basket.addEventListener("drop", (e) => {
      e.preventDefault();
      basket.classList.remove("dragover");

      const type = e.dataTransfer.getData("type");
      if (type === "apple") {
        score += 10;
      } else {
        score -= 5;
      }
      scoreDisplay.textContent = "점수: " + score;
    });
  </script>
</body>
</html>
